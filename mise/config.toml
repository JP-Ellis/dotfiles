# mise/config.toml
# Global tool and runtime configuration.
# Run `mise install` on a new machine to get a complete environment.
# See: https://mise.jdx.dev
#
# Versions are pinned exactly so Renovate opens the bumps. llama.cpp is the
# exception: it releases most days, which is more churn than the pin is worth.

[tools]
# Language runtimes
"core:nodejs" = "24.19.0"
"core:python" = "3.14.7"
"core:ruby"   = "4.0.6"
"core:rust"   = { version = "1.98.0", components = "rustfmt,clippy,rust-src" }
"core:golang" = "1.26.6"

# Core package/runtime tools
"aqua:cargo-bins/cargo-binstall" = "1.22.0"
"cargo:mise"                     = "2026.9.0"
"cargo:uv"                       = "0.12.9"
"github:endevco/aube"            = "2.2.4"

# Shell and navigation
"aqua:direnv/direnv"     = "2.37.1"
"aqua:junegunn/fzf"      = "0.74.3"
"aqua:starship/starship" = "1.26.0"
"cargo:sheldon"          = "0.8.5"
"cargo:zoxide"           = "0.10.0"
"cargo:zsh-patina"       = "1.10.0"

# Git and repo workflows
"aqua:cli/cli"                    = "2.99.0"
"aqua:git-lfs/git-lfs"            = "3.8.0"
"aqua:orhun/git-cliff"            = "2.14.1"
"cargo:cargo-dist"                = "0.32.0"
"cargo:committed"                 = "1.1.11"
"cargo:git-absorb"                = "0.9.0"
"cargo:gitu"                      = "0.43.0"
"cargo:prek"                      = "0.5.1"
"pipx:git-delete-merged-branches" = "7.6.1"

# Everyday text, search, and data tools
"aqua:biomejs/biome"  = "2.5.9"
"aqua:dathere/qsv"    = "22.0.1"
"aqua:jqlang/jq"      = "1.8.2"
"aqua:mikefarah/yq"   = "4.53.6"
"cargo:bat"           = "0.26.1"
"cargo:eza"           = "0.23.5"
"cargo:fd-find"       = "10.5.0"
"cargo:hexyl"         = "0.17.0"
"cargo:htmlq"         = "0.4.0"
"cargo:hwatch"        = "0.4.2"
"cargo:jaq"           = "3.1.1"
"cargo:ripgrep"       = "15.2.0"
"cargo:watchexec-cli" = "2.7.0"
"cargo:yazi-fm"       = "26.5.6"

# Task runners and quality checks
"aqua:google/yamlfmt"             = "0.21.0"
"aqua:hadolint/hadolint"          = "2.15.1"
"aqua:koalaman/shellcheck"        = "0.11.0"
"aqua:mvdan/sh"                   = "3.14.0"
"aqua:rhysd/actionlint"           = "1.7.12"
"aqua:tombi-toml/tombi"           = "1.5.0"
"aqua:trufflesecurity/trufflehog" = "3.97.1"
"cargo:cargo-machete"             = "0.9.2"
"cargo:cargo-nextest"             = "0.9.143"
"cargo:just"                      = "1.58.0"
"cargo:tokei"                     = "14.0.0"
"cargo:typos-cli"                 = "1.50.1"
"github:rvben/rumdl"              = "0.2.63"
"npm:eslint"                      = "10.9.1"
"npm:prettier"                    = "3.9.6"
"pipx:hatch"                      = "1.18.0"
"pipx:yamlfix"                    = "1.19.1"

# Language servers and language-specific linters
"aqua:astral-sh/ruff"            = "0.16.5"
"aqua:astral-sh/ty"              = "0.0.77"
"npm:typescript"                 = "7.0.2"
"npm:typescript-language-server" = "6.0.0"

# Cloud and platform CLIs
"aqua:aws/aws-cli"                = "2.36.37"
"aqua:aws/session-manager-plugin" = "1.2.835.0"
"github:DataDog/pup"              = "1.17.0"
"vfox:mise-plugins/vfox-gcloud"   = "581.0.0"

# Editor CLI for quick edits across repos
"aqua:neovim/neovim" = "0.12.5"

# LLM and AI tools
"aqua:anthropics/claude-code" = "2.1.258"
"github:rtk-ai/rtk"           = "0.46.0"
"github:ggml-org/llama.cpp"   = { version = "latest", version_prefix = "b" }

# Terminal sessions
"github:neurosnap/zmx" = "0.7.1"

# Backups and storage
"cargo:dotter"    = "0.13.5"
"cargo:rustic-rs" = "0.11.4"

[settings]
experimental = true

  [settings.cargo]
  binstall_quickinstall = true

  [settings.python]
  uv_venv_auto = "create|source"
