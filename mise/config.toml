# mise/config.toml
# Global tool and runtime configuration.
# Run `mise install` on a new machine to get a complete environment.
# See: https://mise.jdx.dev
#
# Versions are pinned exactly so Renovate opens the bumps. llama.cpp is the
# exception: it releases most days, which is more churn than the pin is worth.

[tools]
# Language runtimes
"core:nodejs" = "24.19.0"
"core:python" = "3.14.8"
"core:ruby" = "4.0.7"
"core:rust" = { version = "1.99.0", components = "rustfmt,clippy,rust-src" }
"core:golang" = "1.26.6"

# Core package/runtime tools
"aqua:cargo-bins/cargo-binstall" = "1.25.0"
"aqua:jdx/mise" = "2026.10.0"
"aqua:astral-sh/uv" = "0.12.23"
"github:endevco/aube" = "2.6.1"

# Shell and navigation
"aqua:direnv/direnv" = "2.37.1"
"aqua:junegunn/fzf" = "0.74.4"
"aqua:starship/starship" = "1.26.0"
"aqua:rossmacarthur/sheldon" = "0.8.5"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"github:michel-kraemer/zsh-patina" = "1.10.0"
"github:Giammarco-Ferranti/deja" = "0.4.2"

# Git and repo workflows
"aqua:cli/cli" = "2.102.0"
"aqua:git-lfs/git-lfs" = "3.8.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:axodotdev/cargo-dist" = "0.33.0"
"aqua:crate-ci/committed" = "1.1.11"
"cargo:forgejo-cli" = "0.6.0"
"aqua:tummychow/git-absorb" = "0.9.0"
"aqua:altsem/gitu" = "0.43.0"
"aqua:j178/prek" = "0.5.4"
"pipx:git-delete-merged-branches" = "7.6.1"

# Everyday text, search, and data tools
"aqua:biomejs/biome" = "2.5.9"
"aqua:dathere/qsv" = "23.0.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:sharkdp/bat" = "0.26.1"
"cargo:eza" = "0.23.5"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:sharkdp/hexyl" = "0.17.0"
"aqua:mgdm/htmlq" = "0.4.0"
"aqua:blacknon/hwatch" = "0.4.2"
"aqua:01mf02/jaq" = "3.1.1"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:watchexec/watchexec" = "2.7.4"
"aqua:sxyazi/yazi" = "26.9.1"

# Task runners and quality checks
"aqua:google/yamlfmt" = "0.21.0"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:tombi-toml/tombi" = "1.7.1"
"aqua:trufflesecurity/trufflehog" = "3.97.9"
"github:bnjbvr/cargo-machete" = "0.9.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:casey/just" = "1.58.0"
"cargo:tokei" = "15.0.0"
"aqua:crate-ci/typos" = "1.50.3"
"github:rvben/rumdl" = "0.2.78"
"npm:eslint" = "10.11.0"
"npm:prettier" = "3.9.9"
"pipx:hatch" = "1.18.1"
"pipx:yamlfix" = "1.19.1"

# Language servers and language-specific linters
"aqua:astral-sh/ruff" = "0.16.10"
"aqua:astral-sh/ty" = "0.0.84"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.1"

# Cloud and platform CLIs
"aqua:aws/aws-cli" = "2.37.9"
"aqua:aws/session-manager-plugin" = { version = "1.2.835.0", os = ["macos"] }
"github:DataDog/pup" = "1.24.0"
"vfox:mise-plugins/vfox-gcloud" = "581.0.0"

# Editor CLI for quick edits across repos
"aqua:neovim/neovim" = "0.12.5"

# LLM and AI tools
"aqua:anthropics/claude-code" = "2.1.289"
"github:rtk-ai/rtk" = "v0.51.0"
"github:ggml-org/llama.cpp" = { version = "latest", version_prefix = "b" }

# Terminal sessions
"github:neurosnap/zmx" = "0.8.1"

# Backups and storage
"aqua:SuperCuber/dotter" = "0.13.5"
"aqua:rustic-rs/rustic" = "0.11.4"

# Secrets
"cargo:rbw" = "1.15.0"

[settings]
experimental = true

  [settings.cargo]
  binstall_quickinstall = true

  [settings.python]
  compile = false
  uv_venv_auto = "create|source"
