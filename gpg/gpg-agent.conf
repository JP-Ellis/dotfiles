## Keys stay cached for 24h of inactivity; the weekly ceiling only forces a
## re-prompt for a key that has been in continuous use.
default-cache-ttl 86400
default-cache-ttl-ssh 86400
max-cache-ttl 604800
max-cache-ttl-ssh 604800
enable-ssh-support
allow-loopback-pinentry

{{#if (is_executable "/opt/homebrew/bin/pinentry-mac") }}
pinentry-program /opt/homebrew/bin/pinentry-mac
{{else}}
pinentry-program ~/.local/bin/pinentry-auto
{{/if}}
