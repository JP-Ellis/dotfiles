EDITOR='{{app-editor}}'
VISUAL='{{app-visual}}'
PAGER='{{app-pager}}'
## `col -bx` strips the backspace overstrike sequences groff emits for bold and
## underline; bat renders them literally as ^H. `sh -c` because man-db does not
## run MANPAGER through a shell, so a bare pipeline is not portable.
MANPAGER="sh -c 'col -bx | bat -pl man'"
{{#if dotter.macos}}
## macOS apps have no command on PATH; `open` hands URLs to the default browser.
BROWSER='open'
{{else}}
BROWSER='{{app-browser}}'
{{/if}}
