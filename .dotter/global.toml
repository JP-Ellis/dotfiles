[rustic]
  ## One repository serves every machine, so snapshots deduplicate against each
  ## other. Each machine claims its own snapshot group through rustic-host, and
  ## prunes only that group. Defaults describe the Linux desktop; other machines
  ## override these in .dotter/local.toml.
  [rustic.variables]
  rustic-home       = "/home/josh"
  rustic-host       = "jpellis-desktop"
  rustic-repository = "/mnt/nas/rustic"

  [rustic.files]
  ## Scheduling is per-platform: systemd timers on Linux, LaunchAgents on macOS.
  ## systemd expresses the mount guard and the backup/prune/check exclusion
  ## itself; launchd cannot, so on macOS the jobs go through a wrapper that also
  ## drops the backup to hourly while on battery.
  "rustic/bin/rustic-scheduled"                   = {
    target = "~/.local/bin/rustic-scheduled",
    type   = "template",
    if     = "dotter.macos"
  }
  "rustic/launchd/me.jpellis.rustic-backup.plist" = {
    target = "~/Library/LaunchAgents/me.jpellis.rustic-backup.plist",
    type   = "symbolic",
    if     = "dotter.macos"
  }
  "rustic/launchd/me.jpellis.rustic-check.plist"  = {
    target = "~/Library/LaunchAgents/me.jpellis.rustic-check.plist",
    type   = "symbolic",
    if     = "dotter.macos"
  }
  "rustic/launchd/me.jpellis.rustic-prune.plist"  = {
    target = "~/Library/LaunchAgents/me.jpellis.rustic-prune.plist",
    type   = "symbolic",
    if     = "dotter.macos"
  }

  "rustic/systemd/rustic-backup.service" = {
    target = "~/.local/share/systemd/user/rustic-backup.service",
    type   = "template",
    if     = "dotter.linux"
  }
  "rustic/systemd/rustic-backup.timer"   = {
    target = "~/.local/share/systemd/user/rustic-backup.timer",
    type   = "symbolic",
    if     = "dotter.linux"
  }
  "rustic/systemd/rustic-check.service"  = {
    target = "~/.local/share/systemd/user/rustic-check.service",
    type   = "template",
    if     = "dotter.linux"
  }
  "rustic/systemd/rustic-check.timer"    = {
    target = "~/.local/share/systemd/user/rustic-check.timer",
    type   = "symbolic",
    if     = "dotter.linux"
  }
  "rustic/systemd/rustic-prune.service"  = {
    target = "~/.local/share/systemd/user/rustic-prune.service",
    type   = "template",
    if     = "dotter.linux"
  }
  "rustic/systemd/rustic-prune.timer"    = {
    target = "~/.local/share/systemd/user/rustic-prune.timer",
    type   = "symbolic",
    if     = "dotter.linux"
  }

## rustic resolves its config through the platform's native directory and
## ignores XDG_CONFIG_HOME on macOS, where the search path is
## `~/Library/Application Support/rustic/rustic.toml`, then `/etc/rustic`, then
## `./rustic.toml`. A config deployed under ~/.config is therefore read on Linux
## and silently ignored on macOS.
##
## One source mapping to two targets needs the duplicate key TOML forbids, so
## the config file sits in its own per-OS package the way vscode's does. Every
## machine enables `rustic` plus exactly one of these; the `if` guards are a
## backstop against enabling the wrong one, not a licence to enable both.
[rustic-linux]
  [rustic-linux.files]
  "rustic/rustic.toml" = {
    target = "~/.config/rustic/rustic.toml",
    type   = "template",
    if     = "dotter.linux"
  }

[rustic-macos]
  [rustic-macos.files]
  "rustic/rustic.toml" = {
    target = "~/Library/Application Support/rustic/rustic.toml",
    type   = "template",
    if     = "dotter.macos"
  }

