[syncthing]
  ## Syncthing reads .stignore only from a folder root and never replicates it
  ## between devices, so each machine needs its own copy. Deploying through
  ## dotter puts one reviewed version in git and lands it identically on every
  ## machine, which the older .stignore-sync scheme could not guarantee.
  [syncthing.files]
  "syncthing/documents.stignore"  = {
    target = "~/Documents/.stignore",
    type   = "template"
  }
  "syncthing/university.stignore" = {
    target = "~/University/.stignore",
    type   = "template"
  }
  "syncthing/claude.stignore"     = {
    target = "~/.claude/.stignore",
    type   = "template"
  }
  "syncthing/src.stignore"        = {
    target = "~/src/.stignore",
    type   = "template"
  }

## VSCode owns these files at runtime, so they deploy as symlinks and can never
## use dotter templating: the editor rewrites them in place and would overwrite
## any handlebars expression. Machine-specific values are deleted rather than
## parameterised.
##
## Settings Sync stays enabled so it keeps carrying extensions and UI state, but
## its Settings and Keybindings resources must be deselected on every machine.
## Sync writes on its own schedule and would otherwise overwrite these files
## behind dotter's back. That toggle lives in the editor's own account state and
## cannot be expressed here.
##
## The repository copies are named .jsonc so biome parses the comments the files
## carry; VSCode requires the .json names at the target.
##
## macOS and Linux are separate packages rather than one package with `if` per
## entry, because the same source maps to two targets and TOML forbids the
## duplicate key that would need. Each machine enables exactly one in local.toml:
## dotter merges the enabled packages into a single file map, so enabling both
## trips the same duplicate-source error one level up. The `if` guards are a
## backstop against enabling the wrong one, not a licence to enable both.
[vscode-linux]
  [vscode-linux.files]
  "vscode/keybindings.jsonc" = {
    target = "~/.config/Code - Insiders/User/keybindings.json",
    type   = "symbolic",
    if     = "dotter.linux"
  }
  "vscode/settings.jsonc"    = {
    target = "~/.config/Code - Insiders/User/settings.json",
    type   = "symbolic",
    if     = "dotter.linux"
  }

[vscode-macos]
  [vscode-macos.files]
  "vscode/keybindings.jsonc" = {
    target = "~/Library/Application Support/Code - Insiders/User/keybindings.json",
    type   = "symbolic",
    if     = "dotter.macos"
  }
  "vscode/settings.jsonc"    = {
    target = "~/Library/Application Support/Code - Insiders/User/settings.json",
    type   = "symbolic",
    if     = "dotter.macos"
  }

[windows-terminal]
  [windows-terminal.files]
  "windows-terminal/settings.json" = "~/scoop/apps/windows-terminal/current/settings/settings.json"

