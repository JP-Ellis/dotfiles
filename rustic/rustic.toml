# Machine-specific values come from the rustic-* dotter variables. The defaults
# describe the Linux desktop; other machines override them in .dotter/local.toml.

# MARK: Repository

[repository]
repository    = "{{rustic-repository}}"
# The password is deliberately untracked, and rustic does not expand `~`, so the
# path is templated. On a new machine, write the password here and chmod 600
# before the first backup.
password-file = "{{rustic-home}}/.config/rustic/password"

# MARK: Retention

[forget]
# Every machine shares one repository, which is what lets snapshots deduplicate
# against each other. Scoping retention to this host keeps a prune here from
# expiring another machine's snapshots.
filter-host = ["{{rustic-host}}"]

keep-last           = 12
keep-within-hourly  = "2 days"
keep-within-daily   = "28 days"
keep-within-weekly  = "1 year"
keep-within-monthly = "7 years"

# MARK: Backup

[backup]
# Exclusions are expressed as .gitignore-syntax files spread through the tree
# (~/.gitignore, ~/.local/.gitignore, and others). Those files drive rustic and
# other sync tools, and mostly sit outside any git repository, so no-require-git
# is what makes them apply. Both settings are load-bearing.
git-ignore     = true
no-require-git = true

# Backups run every 20 minutes; an unchanged tree records no new snapshot.
skip-if-unchanged = true

exclude-if-present = ["CACHEDIR.TAG", ".nobackup"]

  [[backup.snapshots]]
  name    = "{{rustic-host}}"
  # Pinned so this machine keeps one snapshot group no matter what gethostname()
  # reports. macOS in particular alternates between its FQDN and an mDNS name.
  host    = "{{rustic-host}}"
  sources = ["{{rustic-home}}"]
